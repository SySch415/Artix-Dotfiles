# Transparency
inactive-opacity = 0.90;
active-opacity = 1.0;
frame-opacity = 1.0;
inactive-opacity-override = false;

opacity-rule =  [

  "100:class_g = 'firefox'",
  "100:class_g = 'mpv'",
  "100:class_g = 'Polybar'",
  "100:class_g = 'feh'",
  "100:class_g = 'Rofi'",
  #"75:class_g = 'kitty' && focused",
  #"70:class_g = 'kitty' && !focused"
];

backend = "glx";
blur-background = true;
blur-method = "dual_kawase";
blur-strength = 4;
blur-background-frame = false;
blur-background-fixed = false;

blur-background-exclude = [
  "class_g = 'slop'"
];


shadow = true;
shadow-radius = 14;
shadow-opacity = 0.25;
shadow-offset-x = -12;
shadow-offset-y = -12;

shadow-exclude = [
  "name = 'Notification'",
 # "class_g = 'Polybar'",
  "class_g = 'Rofi'",
  "class_g = 'Dunst'",
  "_GTK_FRAME_EXTENTS@:c"
];

# corners
round-borders = 1;
corner-radius = 8;
rounded-corners-exclude = [
  #"class_g = 'Polybar'",
  "class_g = 'Dunst'",
  "class_g = 'Rofi'"
];

# fading
fading = true;
fade-in-step = 0.03;
fade-out-step = 0.03;
fade-delta = 4;

# general
detect-rounded-corners = true;
detect-client-opacity = true;

