[colors]
background  = #00000000
foreground  = #ebdbb2
black       = #000000
yellow      = #d79921
red         = #cc241d
brown       = #3c3836
disabled    = #555555

[bar/main]
width           = 98%
height          = 24pt
radius          = 0
offset-x        = 1%
offset-y        = 8px
fixed-center    = true
bottom          = false
override-redirect = true

background      = #00000000
foreground      = ${colors.foreground}

font-0 = "Terminus:pixelsize=13;2"
font-1 = "Mononoki Nerd Font:pixelsize=13;2"
font-2 = "Mononoki Nerd Font:size=23;6"

line-size    = 0
border-size  = 0
padding-left = 0
padding-right = 0
module-margin = 0

modules-left   = ld i3 rd
modules-center = ld date rd
modules-right  = ld cpu sep temperature sep memory sep network rd

cursor-click = pointer
enable-ipc   = true
wm-restack   = i3

; --- Pill caps ---
[module/ld]
type             = custom/text
format           = <label>
format-background = #00000000
format-foreground = #000000
label            = "%{T3}%{T-}"

[module/rd]
type             = custom/text
format           = <label>
format-background = #00000000
format-foreground = #000000
label            = "%{T3}%{T-}"

[module/sep]
type             = custom/text
format-background = ${colors.black}
label            = "|"
label-foreground = ${colors.disabled}
label-padding    = 1

; --- Left ---
[module/i3]
type                    = internal/i3
format                  = <label-state>
format-background       = ${colors.black}
label-focused           = " %index% "
label-focused-foreground = ${colors.yellow}
label-unfocused         = " %index% "
label-unfocused-foreground = ${colors.brown}
label-urgent            = " %index% "
label-urgent-foreground = ${colors.red}

; --- Center ---
[module/date]
type             = internal/date
interval         = 1
format-background = ${colors.black}
date             = %a %d %b
time             = %H:%M
format           = <label>
label            = " 󰃮 %date%  %time% "
label-foreground = ${colors.foreground}
enable-click     = true

; --- Right ---
[module/cpu]
type             = internal/cpu
interval         = 2
format-background = ${colors.black}
format           = <label>
label            = "  %percentage%% "
label-foreground = ${colors.foreground}

[module/temperature]
type             = internal/temperature
hwmon-path       = /sys/class/hwmon/hwmon2/temp1_input
interval         = 2
format-background = ${colors.black}
format           = <label>
label            = " 󰔏 %temperature-c% "
label-foreground = ${colors.foreground}

[module/memory]
type             = internal/memory
interval         = 2
format-background = ${colors.black}
format           = <label>
label            = " 󰘚 %mb_used% "
label-foreground = ${colors.foreground}

[module/network]
type                  = internal/network
interface             = wlan0
interval              = 3
format-connected-background = ${colors.black}
format-connected      = <label-connected>
label-connected       = "  %local_ip% "
label-connected-foreground = ${colors.foreground}
format-disconnected-background = ${colors.black}
format-disconnected   = "  down "
format-disconnected-foreground = ${colors.disabled}

[settings]
screenchange-reload = true
pseudo-transparency = true
