[colors]
background  = #40000000
foreground  = #ebdbb2
black       = #000000
yellow      = #d79921
red         = #cc241d
brown       = #3c3836
disabled    = #555555

[bar/base]
width           = 98%
height          = 24pt
radius          = 8
offset-x        = 1%
offset-y        = 8px
fixed-center    = true
bottom          = false
override-redirect = true

background      = #40000000
foreground      = ${colors.foreground}
pseudo-transparency = false

font-0 = "Terminus:pixelsize=13;3"
font-1 = "Mononoki Nerd Font:pixelsize=14;3"
font-2 = "Mononoki Nerd Font:size=26;7"

line-size    = 0
border-size  = 0
padding-left = 0
padding-right = 0
module-margin = 0

cursor-click = pointer
enable-ipc   = true
wm-restack   = i3

[bar/left]
inherit = bar/base
offset-x = 0.5%
width = 200
modules-left = artix sep i3

[bar/center]
inherit = bar/base
offset-x = 47.25%
width = 210
modules-center = date

[bar/right]
inherit = bar/base
offset-x = 91%
width = 425
modules-center = cpu sep temperature sep memory sep network

; --- Pill caps ---

[module/sep]
type             = custom/text
format-background = ${colors.background}
label            = "|"
label-foreground = ${colors.foreground}
label-padding    = 1

; --- Left ---
[module/i3]
type                    = internal/i3
format                  = <label-state>
format-background       = ${colors.background}
label-focused           = " %index% "
label-focused-foreground = ${colors.foreground}
label-unfocused         = " %index% "
label-unfocused-foreground = ${colors.brown}
label-urgent            = " %index% "
label-urgent-foreground = ${colors.red}

[module/artix]
type              = custom/text
format-background = ${colors.background}
label             = "%{T2}  %{T-}"
label-foreground  = ${colors.foreground}

; --- Center ---
[module/date]
type             = internal/date
interval         = 1
format-background = ${colors.background}
date             = %a %d %b
time             = %H:%M
format           = <label>
label            = "%{T2} 󰃮 %{T-}  %date%  %time% "
label-foreground = ${colors.foreground}
enable-click     = true

; --- Right ---
[module/cpu]
type             = internal/cpu
interval         = 2
format-background = ${colors.background}
format           = <label>
label            = " %{T2}  %{T-} %percentage%% "
label-foreground = ${colors.foreground}

[module/temperature]
type             = custom/script
exec             = ~/.config/polybar/cpu_temp.sh
interval          = 2
format-background = ${colors.background}
format           = <label>
label            = " 󰔏 %output% "
label-foreground = ${colors.foreground}

[module/memory]
type             = internal/memory
interval         = 2
format-background = ${colors.background}
format           = <label>
label            = " 󰘚  %mb_used% "
label-foreground = ${colors.foreground}

[module/network]
type                  = internal/network
interface             = wlan0
interval              = 3
format-connected-background = ${colors.background}
format-connected      = <label-connected>
label-connected       = "%{T2} 󰖩 %{T-} %local_ip% "
label-connected-foreground = ${colors.foreground}
format-disconnected-background = ${colors.background}
format-disconnected   = "%{T2} 󰖩 %{T-} down "
format-disconnected-foreground = ${colors.foreground}

[settings]
screenchange-reload = true
